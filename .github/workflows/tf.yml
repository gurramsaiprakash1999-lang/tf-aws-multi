name: "Universal Terraform GitOps Workflow"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select action to perform on ALL resources"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

# Prevent race conditions when pushing state
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  terraform:
    name: "Execute Terraform"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull repository and existing state file
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Step 2: Configure AWS credentials from GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      # Step 3: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Step 4: Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Step 5: Apply ALL resources (when 'apply' is chosen)
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      # Step 6: Destroy ALL resources (when 'destroy' is chosen)
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false

      # Step 7: Push updated state back to GitHub
      - name: Persist State to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull any new commits first to avoid conflicts
          git pull --rebase origin ${{ github.ref_name }} || true
          
          # Stage the state file
          git add terraform.tfstate* || true
          
          # Commit only if state changed
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(state): sync terraform state [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
